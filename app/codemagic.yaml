# Codemagic pipeline for Nazra iOS — the ONLY working build route from this
# Windows machine: `npx expo prebuild --platform ios` is proven to exit 1 on
# Windows (F27), so prebuild, pod install, archive, sign and .ipa packaging all
# happen on the Codemagic macOS runner (books/IPA.md Route A).
#
# One-time setup (Codemagic dashboard → Workflow editor → this app):
#   1. Link the repo and select workflow `nazra-ios-ipa`.
#   2. App Store Connect API key: add the "XCODE_APP" doc-type credentials, or
#      set variables XCODE_ISSUER_ID + XCODE_KEY_ID + XCODE_KEY (p8 content).
#   3. iOS distribution certificate (p12) → CM_CERTIFICATE +
#      CM_CERTIFICATE_PASSWORD. Provisioning profile for jo.nazra.app →
#      CM_PROVISIONING_PROFILE. Or leave both empty: when ASC is linked,
#      `use-profiles` auto-generates them on the runner.
# Dashboard → Start build → the signed .ipa lands in the Artifacts tab →
# install via Sideloadly / AltStore / Apple Configurator
# (see release/ios/SIGNING_INSTRUCTIONS.md).
workflows:
  nazra-ios-ipa:
    name: Nazra iOS .ipa
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_WORKSPACE: ios/Nazra.xcworkspace
        XCODE_SCHEME: Nazra
        BUNDLE_ID: jo.nazra.app
#       Signing variables come from the dashboard (CM_CERTIFICATE,
#       CM_CERTIFICATE_PASSWORD, CM_PROVISIONING_PROFILE, XCODE_* ASC key) —
#       never inline secrets in this file.
    scripts:
      - name: Install Node deps
        script: |
          npm ci --cache .npm || npm install --cache .npm
      - name: Expo prebuild (iOS, on the macOS runner)
        script: |
          npx expo prebuild --platform ios --no-install
      - name: Set up signing keychain + profiles
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Bundle, sign and package .ipa
        script: |
          cd ios
          pod install
          cd ..
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your.email@domain.tld
      # optionally publish to App Store Connect / TestFlight:
      # app_store_connect:
      #   auth: integration
